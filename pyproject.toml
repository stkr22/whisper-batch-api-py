[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[project]
name = "app"
version = "2.6.1"
description = "Simple Whisper API for batch processing of audio data."
authors = [{ name = "stkr22", email = "stkr22@github.com" }]
readme = "README.md"
license = "GPL-3.0-only"
license-files = [
    "LICENSE",
]

keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Home Automation",
]

requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi[standard]~=0.128.0",
    "python-multipart~=0.0.22",
    "faster-whisper~=1.2.1"
]

[project.urls]
Homepage = "https://github.com/stkr22/whisper-batch-api-py"
Repository = "https://github.com/stkr22/whisper-batch-api-py"
Documentation = "https://github.com/stkr22/whisper-batch-api-py/tree/main/docs"
Issues = "https://github.com/stkr22/whisper-batch-api-py/issues"
Changelog = "https://github.com/stkr22/whisper-batch-api-py/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff~=0.14.2",
    "mypy~=1.19.1",
    "pytest~=9.0.2",
    "pytest-cov~=7.0.0",
]
